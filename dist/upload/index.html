:root {
  /* Utama */
  --cobalt-500: #7DA7D9;  /* soft cobalt */
  --butter-300: #FFF7CC;  /* butter yellow */

  /* Pendukung */
  --navy-900: #2F4860;
  --white: #FFFFFF;
  --ice-100: #DCEEFF;

  /* Turunan */
  --cobalt-700: #3F6FA8;
  --cobalt-800: #345E91;
  --cobalt-300: #A9C6E8;
  --cobalt-100: #EAF2FB;
  --butter-500: #F5D96B;
  --butter-100: #FFFBE6;
  --navy-600: #5A6F85;
  --navy-300: #9FB0C2;
  --line: #D5E2F0;

  /* Warna ilustrasi permainan (hanya untuk gambar, bukan teks) */
  --game-water: #A9C6E8;
  --game-pad: #8FC79A;
  --game-pad-dark: #5FAF72;
  --game-sky: #EAF2FB;
  --game-wood: #C98F5B;

  --success-600: #2F7D5B;
  --success-100: #E3F4EA;
  --error-600: #B5483E;
  --error-100: #FBE7E4;

  /* Peran */
  --bg: var(--ice-100);
  --surface: var(--white);
  --surface-warm: var(--butter-300);
  --text: var(--navy-900);
  --text-muted: var(--navy-600);
  --primary: var(--cobalt-500);
  --on-primary: var(--navy-900);
  --link: var(--cobalt-700);

  /* Tipografi */
  --font: 'Nunito', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  --fs-display: 2rem;
  --fs-h1: 1.5rem;
  --fs-h2: 1.25rem;
  --fs-body: 1.0625rem;
  --fs-small: 0.875rem;
  --fs-button: 1.125rem;

  /* Spasi & bentuk */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px; --radius-pill: 999px;
  --shadow-card: 0 4px 16px rgba(47, 72, 96, 0.08);
  --shadow-fab: 0 8px 24px rgba(47, 72, 96, 0.22);
  --content-max: 520px;
  --nav-h: 68px;
  --tap: 44px;
}

html[data-font='large'] { font-size: 115%; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 800; }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
p { margin: 0; }
a { color: var(--link); }
button, input { font: inherit; color: inherit; }
sub { font-size: 0.68em; line-height: 0; position: relative; bottom: -0.15em; vertical-align: baseline; }
img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid var(--cobalt-700); outline-offset: 2px; border-radius: 6px; }
[hidden], .hidden { display: none !important; }

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 100;
  background: var(--navy-900); color: var(--white); padding: 8px 12px; border-radius: var(--radius-sm);
}
.skip-link:focus { top: 8px; }

.app { max-width: var(--content-max); margin: 0 auto; }
#view { outline: none; }
.page {
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: calc(var(--space-4) + env(safe-area-inset-top)) var(--space-4) calc(var(--nav-h) + var(--space-7) + env(safe-area-inset-bottom));
  animation: page-in 200ms ease-out;
}
body.is-focus .page { padding-bottom: calc(var(--space-7) + env(safe-area-inset-bottom)); }
body.is-focus .bottom-nav { display: none; }
@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.muted { color: var(--text-muted); }
.small { font-size: var(--fs-small); }
.center { text-align: center; }
.eyebrow { font-size: var(--fs-small); font-weight: 700; color: var(--cobalt-800); text-transform: uppercase; letter-spacing: 0.04em; }
.section-title { font-size: 1.1rem; margin-top: var(--space-2); }

.boot { min-height: 70dvh; display: grid; place-items: center; align-content: center; gap: 12px; color: var(--text-muted); }
.boot-mark {
  width: 56px; height: 56px; border-radius: 50%; background: var(--cobalt-500);
  box-shadow: inset 0 0 0 14px var(--cobalt-300); animation: pulse 1.2s ease-in-out infinite alternate;
}
@keyframes pulse { to { transform: scale(0.86); } }
.noscript { padding: 24px; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ======================================================= tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 12px 22px; border-radius: var(--radius-pill); border: 2px solid transparent;
  font-size: var(--fs-button); font-weight: 800; cursor: pointer; text-decoration: none;
  transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 0 var(--cobalt-700); }
.btn-primary:hover:not(:disabled) { background: var(--cobalt-300); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
.btn-secondary:hover:not(:disabled) { background: var(--cobalt-100); }
.btn-ghost { background: transparent; color: var(--cobalt-800); min-height: var(--tap); padding: 8px 14px; font-size: 1rem; }
.btn-ghost:hover:not(:disabled) { background: var(--cobalt-100); }
.btn-sm { min-height: var(--tap); padding: 8px 16px; font-size: 1rem; }
.btn-block { width: 100%; }
/* Teks navy di atas cobalt-500 = 3.8:1 → wajib teks besar tebal (≥ 18,66 px). */
.btn.btn-primary { font-size: 1.1875rem; }
.btn-square { width: 52px; padding: 0; flex: none; }
.icon { display: inline-flex; line-height: 0; }

.icon-btn {
  width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; flex: none;
  border: 0; border-radius: 50%; background: var(--surface); color: var(--text); cursor: pointer; box-shadow: var(--shadow-card);
}
.icon-btn:hover { background: var(--cobalt-100); }
.icon-btn.is-on { background: var(--butter-300); color: var(--error-600); }
.link-btn { background: none; border: 0; color: var(--link); font-weight: 700; padding: 12px; cursor: pointer; min-height: var(--tap); }

/* ======================================================= kartu */
.card {
  min-width: 0;
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: inherit;
}
.empty { align-items: center; text-align: center; padding: 32px 20px; color: var(--text-muted); }
.empty h2 { color: var(--text); }
.badge {
  align-self: flex-start; display: inline-block; font-size: 0.8rem; font-weight: 800; padding: 4px 10px;
  border-radius: var(--radius-pill); background: var(--butter-300); color: var(--navy-900);
}
.pill { font-size: 0.8rem; font-weight: 700; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--cobalt-100); color: var(--cobalt-800); }

/* ======================================================= chip simbol & rumus */
.chip {
  display: inline-block; min-width: 1.7em; padding: 0 0.4em; border-radius: var(--radius-pill);
  font-weight: 800; text-align: center; font-style: italic; line-height: 1.5;
}
.chip-a { background: var(--cobalt-100); box-shadow: inset 0 0 0 2px var(--cobalt-500); }
.chip-b { background: var(--butter-300); box-shadow: inset 0 0 0 2px var(--butter-500); }
.chip-n { text-decoration: underline dashed 2px; text-underline-offset: 4px; }
.formula {
  display: block; margin: 12px 0; padding: 14px 16px; border-radius: var(--radius-md); text-align: center;
  background: var(--cobalt-100); font-weight: 800; font-size: 1.15rem;
}
.formula.big { font-size: 1.45rem; padding: 18px 12px; }
.step-text .formula { margin-bottom: 8px; }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.steps li::marker { font-weight: 800; color: var(--cobalt-800); }

/* ======================================================= input */
.field-label { font-weight: 800; font-size: var(--fs-small); margin-bottom: -6px; }
.text-input {
  width: 100%; min-height: 52px; padding: 10px 16px; border-radius: var(--radius-md);
  border: 2px solid var(--line); background: var(--white); font-size: 1.1rem;
}
.text-input:focus { border-color: var(--cobalt-500); outline: none; box-shadow: 0 0 0 4px var(--cobalt-100); }
.q-fields { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.q-fields.is-multi { grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); }
.q-fields.is-stack { grid-template-columns: minmax(0, 1fr); }
.num-field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.num-label { font-weight: 800; font-size: 1rem; overflow-wrap: anywhere; }
.chip-label.chip-a, .chip-label.chip-b { padding: 2px 10px; justify-self: start; font-style: normal; }
.num-row { display: flex; gap: 6px; min-width: 0; }
.num-input {
  flex: 1; min-width: 0; width: 100%; height: 56px; padding: 0 14px; border-radius: var(--radius-md);
  border: 2px solid var(--line); background: var(--white); font-size: 1.5rem; font-weight: 800;
}
.num-input:focus { border-color: var(--cobalt-500); outline: none; box-shadow: 0 0 0 4px var(--cobalt-100); }
.pm-btn {
  width: 48px; flex: none; border-radius: var(--radius-md); border: 2px solid var(--line);
  background: var(--cobalt-100); font-size: 1.4rem; font-weight: 800; cursor: pointer;
}
.is-correct.num-input, .blank.is-correct { border-color: var(--success-600); background: var(--success-100); }
.is-wrong.num-input, .blank.is-wrong { border-color: var(--error-600); background: var(--error-100); }
.is-revealed { border-style: dashed !important; border-color: var(--cobalt-700) !important; background: var(--cobalt-100) !important; }
.blank {
  width: 4.2em; height: 40px; margin: 0 4px; text-align: center; border-radius: var(--radius-sm);
  border: 2px dashed var(--cobalt-500); background: var(--butter-100); font-weight: 800; font-size: 1.1rem;
}
.blank:focus { outline: none; border-style: solid; box-shadow: 0 0 0 4px var(--cobalt-100); }

/* ======================================================= pilihan */
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px;
  border-radius: var(--radius-md); border: 2px solid var(--line); background: var(--white);
  text-align: left; cursor: pointer; font-weight: 600; transition: border-color 120ms, background-color 120ms;
}
.choice:hover:not(:disabled) { border-color: var(--cobalt-500); }
.choice:disabled { cursor: default; }
.choice-key {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cobalt-100); font-weight: 800; font-size: 0.9rem;
}
.choice.is-picked { border-color: var(--cobalt-700); background: var(--cobalt-100); }
.choice.is-correct { border-color: var(--success-600); background: var(--success-100); }
.choice.is-correct .choice-key { background: var(--success-600); color: var(--white); }
.choice.is-wrong { border-color: var(--error-600); background: var(--error-100); }
.choice.is-wrong .choice-key { background: var(--error-600); color: var(--white); }

/* ======================================================= umpan balik & hint */
.feedback { border-radius: var(--radius-md); padding: 12px 14px; display: grid; gap: 6px; animation: page-in 160ms ease-out; }
.feedback-title { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.feedback-correct { background: var(--success-100); }
.feedback-correct .feedback-title { color: var(--success-600); }
.feedback-wrong { background: var(--error-100); }
.feedback-wrong .feedback-title { color: var(--error-600); }
.feedback-hint { background: var(--butter-300); }
.feedback-body details summary { cursor: pointer; font-weight: 700; color: var(--cobalt-800); min-height: var(--tap); display: flex; align-items: center; }
.solution { margin: 6px 0 0; padding-left: 1.3em; display: grid; gap: 4px; }
.q-hints { display: grid; gap: 8px; }
.q-hints:empty, .q-feedback:empty, .q-extra:empty { display: none; }
.hint-card, .calc-check {
  background: var(--butter-300); border-radius: var(--radius-md); padding: 12px 14px;
  border-left: 5px solid var(--butter-500); animation: page-in 160ms ease-out;
}
.calc-check { background: var(--cobalt-100); border-left-color: var(--cobalt-500); }
.hint-level { display: block; font-size: 0.8rem; font-weight: 800; color: var(--navy-600); text-transform: uppercase; letter-spacing: 0.04em; }

/* ======================================================= kartu soal */
.q-stage { display: grid; gap: 16px; }
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.q-count { font-size: var(--fs-small); font-weight: 800; color: var(--text-muted); }
.q-prompt { font-size: 1.15rem; }
.q-tools { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px 0; }
.q-tools:empty { display: none; }
.q-actions { display: grid; }
.summary-card { align-items: center; text-align: center; }
.summary-big { font-size: 3rem; font-weight: 900; color: var(--cobalt-800); line-height: 1; }
.summary-big small { font-size: 1.4rem; color: var(--text-muted); }
.quiz-recap { margin: 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 6px; width: 100%; font-size: var(--fs-small); }
.quiz-recap li { padding: 8px 12px; border-radius: var(--radius-sm); }
.quiz-recap .ok { background: var(--success-100); }
.quiz-recap .no { background: var(--error-100); }

/* titik progres */
.dots { display: flex; gap: 6px; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: all 160ms; }
.dot.is-current { width: 26px; border-radius: 6px; background: var(--cobalt-500); }
.dot.is-correct { background: var(--success-600); }
.dot.is-wrong { background: var(--error-600); }
.dot.is-done { background: var(--cobalt-700); }

/* ======================================================= progres */
.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring-track { fill: none; stroke: var(--ice-100); stroke-width: 12; }
.ring-bar { fill: none; stroke: var(--cobalt-500); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 600ms ease; }
.ring-center { position: absolute; display: grid; text-align: center; line-height: 1.1; }
.ring-label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
.ring-value { font-size: var(--fs-display); font-weight: 900; }
.ring-value small { font-size: 1rem; color: var(--text-muted); }
.ring-caption { font-size: 0.8rem; color: var(--text-muted); }
.segments { display: flex; gap: 4px; }
.seg { flex: 1; height: 8px; border-radius: 4px; background: var(--white); }
.seg.is-done { background: var(--cobalt-500); }
.seg.is-current { background: var(--butter-500); }
.stars { display: inline-flex; gap: 2px; color: var(--butter-500); }
.stars .icon svg { stroke: var(--navy-300); stroke-width: 1.5; }
.bar { height: 8px; border-radius: 4px; background: var(--white); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--cobalt-500); transition: width 300ms; }

/* ======================================================= navigasi bawah */
.bottom-nav {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 20;
  width: 100%; max-width: var(--content-max); height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding: 6px 8px env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: 0 -4px 20px rgba(47, 72, 96, 0.08);
}
.nav-item {
  display: grid; justify-items: center; gap: 2px; padding: 6px 0; min-height: var(--tap);
  color: var(--navy-600); text-decoration: none; font-size: 0.75rem; font-weight: 700;
}
.nav-item.is-active { color: var(--cobalt-800); }
.nav-item.is-active .nav-icon { background: var(--cobalt-100); }
.nav-icon { display: grid; place-items: center; width: 48px; height: 30px; border-radius: var(--radius-pill); }
.nav-fab .nav-icon {
  width: 62px; height: 62px; margin-top: -34px; border-radius: 50%;
  background: var(--cobalt-500); color: var(--navy-900); box-shadow: var(--shadow-fab); border: 5px solid var(--bg);
}
.nav-fab.is-active .nav-icon { background: var(--butter-500); }

/* ======================================================= header */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: 4px; }
.page-head p { margin-top: 4px; }
.focus-head { display: flex; align-items: center; gap: 10px; }
.focus-title { flex: 1; font-weight: 800; text-align: center; }
.home-head { display: flex; justify-content: space-between; align-items: center; }

/* ======================================================= beranda */
.hero { flex-direction: row; align-items: center; justify-content: space-around; gap: 12px; padding: 18px 12px; }
.hero-stats { display: grid; gap: 10px; justify-items: center; }
.stat { display: grid; justify-items: center; line-height: 1.15; }
.stat-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px; }
.stat-star { background: var(--butter-300); color: var(--butter-500); }
.stat-star svg { stroke: var(--navy-900); stroke-width: 1.2; }
.stat-check { background: var(--cobalt-100); color: var(--cobalt-800); }
.stat-num { font-size: 1.5rem; font-weight: 900; }
.stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
.stat-sep { width: 60%; height: 2px; background: var(--ice-100); }
.continue-card {
  flex-direction: row; align-items: center; justify-content: space-between;
  background: var(--butter-300); border: 2px solid var(--butter-500);
}
.continue-card h2 { font-size: 1.1rem; margin: 2px 0; }
.play {
  flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cobalt-500); color: var(--navy-900); box-shadow: 0 4px 0 var(--cobalt-700);
}
.banner { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.banner-actions { display: flex; align-items: center; gap: 6px; }
.banner-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--cobalt-100); display: grid; place-items: center; flex: none; }
.banner-install > div { flex: 1; }

/* Kotak Ulas Lagi: putih seragam + bintang empat sudut soft cobalt (motif palet). */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  position: relative; display: grid; align-content: start; gap: 2px; min-height: 132px; min-width: 0;
  padding: 18px 14px 14px; border-radius: 28px 28px var(--radius-md) var(--radius-md);
  background: var(--white); color: var(--navy-900); box-shadow: var(--shadow-card);
  text-decoration: none; transition: transform 120ms ease;
}
.tile:active { transform: scale(0.97); }
.tile-star { position: absolute; top: 14px; right: 14px; line-height: 0; color: var(--cobalt-500); }
.tile-title { font-weight: 800; font-size: 1.1rem; line-height: 1.2; padding-right: 28px; overflow-wrap: anywhere; }
.tile-count { font-size: 2rem; font-weight: 900; line-height: 1.15; margin-top: 4px; }
.tile-sub {
  justify-self: start; margin-top: 4px; padding: 2px 10px; border-radius: var(--radius-pill);
  font-size: 0.8rem; font-weight: 700; background: var(--ice-100); color: var(--navy-900);
}

/* ======================================================= modul */
.module-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.module-card { flex-direction: row; align-items: center; gap: 14px; padding: 16px; }
.module-card.is-next { box-shadow: inset 0 0 0 3px var(--cobalt-500), var(--shadow-card); }
.module-num {
  flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
  background: var(--cobalt-100); font-weight: 900; font-size: 1.2rem;
}
.module-card.is-done .module-num { background: var(--cobalt-500); }
.module-info { flex: 1; display: grid; gap: 4px; }
.module-info h2 { font-size: 1.05rem; }
.module-info .muted { font-size: var(--fs-small); }
.module-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chev { color: var(--navy-300); }

/* ======================================================= pelajaran */
.lesson-progress { display: grid; gap: 6px; }
.lesson-kind { font-size: var(--fs-small); font-weight: 800; color: var(--cobalt-800); }
.lesson-stage { display: grid; gap: 16px; }
.lesson-foot {
  position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 0 calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 75%, transparent);
}
.lesson-foot .btn-primary { flex: 1; }
.step-card h2 { outline: none; }
.step-text { font-size: 1.1rem; }
.step-text b, .problem b { color: var(--navy-900); }
.step-intro { display: grid; gap: 4px; }
.step-intro h2 { outline: none; }
.problem { background: var(--ice-100); border-radius: var(--radius-md); padding: 12px 14px; font-size: 1.1rem; }
.worked { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: w; }
.worked-step {
  counter-increment: w; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; border-radius: var(--radius-md); background: var(--white);
  border: 2px solid var(--ice-100); animation: page-in 200ms ease-out; font-size: 1.08rem;
}
.worked-step::before {
  content: counter(w); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cobalt-700); color: var(--white); font-weight: 800; font-size: 0.85rem;
}
.reveal { background: var(--butter-300); border-radius: var(--radius-md); padding: 12px 14px; animation: page-in 200ms ease-out; }
.step-hook { background: linear-gradient(160deg, var(--white) 55%, var(--butter-100)); }

.finish-card { align-items: center; text-align: center; }
.finish-icon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--butter-300); color: var(--butter-500); }
.finish-icon svg { stroke: var(--navy-900); stroke-width: 1; }
.finish-card .stars .icon svg { width: 34px; height: 34px; }
.finish-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--fs-small); }
.finish-actions { display: grid; gap: 10px; }
.survey-card { align-items: center; text-align: center; }
.survey-q { font-weight: 800; }
.effort-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
.effort {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px; min-height: 64px;
  border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--white); cursor: pointer;
}
.effort:hover { border-color: var(--cobalt-500); background: var(--cobalt-100); }
.effort-emoji { font-size: 1.6rem; line-height: 1.2; }
.effort-label { font-size: 0.68rem; font-weight: 700; color: var(--navy-600); line-height: 1.1; }

/* ======================================================= soal cerita */
.story-card summary { list-style: none; display: grid; gap: 6px; cursor: pointer; }
.story-card summary::-webkit-details-marker { display: none; }
.story-title { font-weight: 800; font-size: 1.15rem; }
.story-text { font-size: 1.1rem; }
.story-text mark { background: var(--butter-300); box-shadow: 0 -0.15em 0 var(--butter-500) inset; padding: 0 2px; border-radius: 4px; color: inherit; }
.mini-table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 1rem; }
.mini-table th, .mini-table td { border: 2px solid var(--line); padding: 6px 8px; text-align: center; }
.mini-table th { background: var(--cobalt-100); text-align: left; font-weight: 800; }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.stepper-item { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px 16px; opacity: 0.55; }
.stepper-item.is-current, .stepper-item.is-done { opacity: 1; }
.stepper-item.is-current { box-shadow: inset 0 0 0 3px var(--cobalt-500), var(--shadow-card); }
.stepper-head { display: flex; align-items: center; gap: 10px; }
.stepper-num {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--ice-100); font-weight: 800;
}
.is-current .stepper-num { background: var(--cobalt-700); color: var(--white); }
.is-done .stepper-num { background: var(--success-600); color: var(--white); }
.stepper-title { flex: 1; font-weight: 800; }
.is-done .stepper-done::after { content: '✓'; color: var(--success-600); font-weight: 900; }
.stepper-body { display: grid; gap: 12px; }
.stepper-item:not(.is-current):not(.is-done) .stepper-body { display: none; }
.is-current .stepper-body, .is-done .stepper-body { margin-top: 12px; }
.stepper-ask { font-weight: 700; }
.stepper-summary { color: var(--text-muted); font-size: 0.98rem; }

/* ======================================================= latihan bebas */
.topic-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.topic {
  flex: none; min-height: var(--tap); padding: 8px 16px; border-radius: var(--radius-pill);
  border: 2px solid var(--line); background: var(--white); font-weight: 700; cursor: pointer; white-space: nowrap;
}
.topic.is-on { background: var(--cobalt-700); border-color: var(--cobalt-700); color: var(--white); }
.practice-area { display: grid; gap: 16px; }

/* ======================================================= tantangan */
.challenge { display: grid; gap: 16px; }
.flash-card { min-height: 220px; justify-content: center; align-items: center; text-align: center; border: 3px solid transparent; transition: border-color 160ms; }
.flash-card.is-correct { border-color: var(--success-600); }
.flash-card.is-wrong { border-color: var(--error-600); }
.flash-text { font-size: 1.4rem; font-weight: 800; }
.round-row { display: flex; justify-content: center; gap: 40px; }
.round-wrap { display: grid; justify-items: center; gap: 6px; font-weight: 800; }
.round-btn {
  width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
  box-shadow: var(--shadow-fab); transition: transform 120ms;
}
.round-btn:active:not(:disabled) { transform: scale(0.94); }
.round-btn:disabled { opacity: 0.6; }
.round-no { background: var(--white); color: var(--error-600); }
.round-yes { background: var(--cobalt-500); color: var(--navy-900); }
.round-btn.is-correct { box-shadow: 0 0 0 5px var(--success-600); opacity: 1; }
.round-btn.is-wrong { box-shadow: 0 0 0 5px var(--error-600); opacity: 1; }

/* ======================================================= profil */
.profile-card { flex-direction: row; align-items: center; }
.avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--cobalt-500); flex: none; }
.setting { display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; position: relative; }
.setting-text { flex: 1; display: grid; }
.switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { width: 52px; height: 30px; border-radius: var(--radius-pill); background: var(--line); position: relative; flex: none; transition: background 160ms; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 160ms; }
.switch-input:checked + .switch { background: var(--cobalt-700); }
.switch-input:checked + .switch::after { transform: translateX(22px); }
.switch-input:focus-visible + .switch { outline: 3px solid var(--cobalt-700); outline-offset: 2px; }
.list { padding: 6px 8px; gap: 0; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 8px; min-height: 60px; text-decoration: none; color: inherit; border-radius: var(--radius-md); }
.list-row + .list-row { border-top: 2px solid var(--ice-100); }
.list-row:hover { background: var(--cobalt-100); }
.list-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--butter-300); flex: none; }
.list-text { flex: 1; display: grid; }
.sync-card { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.danger-zone { display: grid; gap: 4px; justify-items: center; }
.danger-zone .btn-ghost { color: var(--error-600); }

/* ======================================================= angket */
.survey-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.survey-item { gap: 10px; }
.scale { display: grid; gap: 4px; }
.scale-11 { grid-template-columns: repeat(11, 1fr); }
.scale-5 { grid-template-columns: repeat(5, 1fr); }
.scale-btn {
  min-height: var(--tap); padding: 0; border-radius: 10px; border: 2px solid var(--line); background: var(--white);
  font-weight: 800; cursor: pointer; font-size: 0.95rem;
}
.scale-btn.is-on { background: var(--cobalt-700); border-color: var(--cobalt-800); color: var(--white); }
.scale-ends { display: flex; justify-content: space-between; }

/* ======================================================= welcome & join */
.welcome { min-height: 100dvh; justify-content: center; text-align: center; padding-bottom: 32px !important; }
.brand { display: flex; align-items: center; justify-content: center; gap: 10px; }
.brand-mark { width: 48px; height: 48px; border-radius: 50%; box-shadow: var(--shadow-card); }
.brand-name { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.01em; }
.brand-tag { color: var(--text-muted); font-weight: 700; margin-top: -8px; }
.welcome-stage { min-height: 300px; display: grid; align-items: center; }
.welcome-slide { display: grid; gap: 12px; animation: page-in 220ms ease-out; }
.welcome-art { background: var(--white); border-radius: var(--radius-lg); padding: 20px 12px; box-shadow: var(--shadow-card); min-height: 150px; display: grid; align-items: center; }
.welcome-actions { display: grid; gap: 4px; }
.join { min-height: 90dvh; justify-content: center; }
.join-card { gap: 12px; }

/* ======================================================= visual pola */
.viz { width: 100%; display: grid; justify-items: center; gap: 6px; }
.viz-svg { width: 100%; height: auto; max-height: 210px; overflow: visible; }
.viz-caption { font-size: var(--fs-small); color: var(--text-muted); }
.nl-axis { stroke: var(--navy-300); stroke-width: 2; }
.nl-arc { fill: none; stroke: var(--butter-500); stroke-width: 3; stroke-linecap: round; }
.nl-jump { font: 800 13px var(--font); fill: var(--navy-900); text-anchor: middle; }
.nl-dot { fill: var(--cobalt-500); }
.nl-dot-a { fill: var(--cobalt-700); }
.nl-val { font: 700 12px var(--font); fill: var(--navy-900); text-anchor: middle; }
.nl-left { text-anchor: start; }
.tile { fill: var(--cobalt-500); }
.tile-unknown { fill: none; stroke: var(--cobalt-500); stroke-width: 1.5; stroke-dasharray: 3 2; }
.stick { stroke: var(--butter-500); stroke-width: 4.5; stroke-linecap: round; }
.post { fill: var(--cobalt-500); }
.post-a { fill: var(--cobalt-700); }
.seat { fill: var(--cobalt-500); }
.viz-terms, .viz-diff { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 6px; }
.term {
  display: grid; justify-items: center; min-width: 52px; padding: 8px 6px 6px; border-radius: 14px;
  background: var(--cobalt-100); box-shadow: inset 0 0 0 2px var(--cobalt-300);
}
.term-val { font-size: 1.3rem; font-weight: 900; line-height: 1.1; }
.term-idx { font-size: 0.85rem; color: var(--navy-600); font-weight: 700; }
.term-more { background: transparent; box-shadow: none; min-width: 24px; }
.diff-pill { display: grid; justify-items: center; align-self: flex-start; font-weight: 800; font-size: 0.9rem; margin: 0 -2px; }
.diff-pill svg { width: 34px; height: 12px; }
.diff-pill path { fill: none; stroke: var(--butter-500); stroke-width: 3; stroke-linecap: round; }
.diff-pill span { background: var(--butter-300); border-radius: var(--radius-pill); padding: 0 6px; }
.viz-derive { justify-items: stretch; }
.derive-table { display: grid; gap: 6px; }
.derive-row {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'l e' 's s'; gap: 2px 8px;
  padding: 8px 12px; border-radius: var(--radius-md); background: var(--ice-100); animation: page-in 200ms ease-out;
}
.derive-row > span:first-child { grid-area: l; }
.derive-eq { grid-area: e; font-weight: 800; }
.derive-sym { grid-area: s; color: var(--navy-600); }
.derive-final { background: var(--butter-300); font-weight: 800; }
.derive-final .derive-sym { color: var(--navy-900); font-size: 1.1rem; }

/* ======================================================= kartu rumus */
.formula-card { display: grid; gap: 12px; }
.legend { margin: 0; display: grid; gap: 8px; }
.legend div { display: flex; align-items: center; gap: 12px; }
.legend dt { min-width: 44px; text-align: center; font-weight: 800; }
.legend dd { margin: 0; }
.formula-example { background: var(--butter-300); border-radius: var(--radius-md); padding: 12px 14px; display: grid; gap: 2px; }
.formula-ex-title { font-weight: 800; }
.formula-tips { display: grid; gap: 4px; font-size: 0.98rem; }

/* ======================================================= sheet & toast */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(47, 72, 96, 0.4); z-index: 40; animation: fade 180ms ease-out; }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 41;
  width: 100%; max-width: var(--content-max); max-height: 86dvh; overflow-y: auto;
  background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); animation: sheet-in 220ms ease-out; outline: none;
}
.sheet-handle { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head .icon-btn { box-shadow: none; background: var(--ice-100); }
.sheet.closing { animation: sheet-out 180ms ease-in forwards; }
.sheet-backdrop.closing { animation: fade 180ms ease-in reverse forwards; }
@keyframes sheet-in { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
@keyframes sheet-out { to { transform: translate(-50%, 100%); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.toast-host { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px); transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--navy-900); color: var(--white); padding: 10px 16px; border-radius: var(--radius-pill); font-weight: 700; text-align: center; animation: page-in 160ms ease-out; }
.toast.closing { opacity: 0; transition: opacity 200ms; }

@media (min-width: 560px) {
  .page { padding-top: 28px; }
  .q-prompt, .step-text { font-size: 1.15rem; }
}

.confirm-body { display: grid; gap: 16px; }

/* ======================================================= pusat latihan */
.hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hub-card { position: relative; gap: 6px; padding: 16px 14px; min-height: 132px; }
.hub-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--cobalt-100); color: var(--cobalt-800); }
.hub-title { font-weight: 800; font-size: 1.05rem; line-height: 1.25; }
.hub-sub { font-size: 0.82rem; color: var(--text-muted); line-height: 1.35; }
.hub-badge { position: absolute; top: 14px; right: 12px; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--butter-300); font-size: 0.8rem; font-weight: 800; }
.daily-card { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.daily-card > div { display: grid; gap: 2px; }
.daily-big { font-size: 1.6rem; font-weight: 900; color: var(--cobalt-800); }
.daily-card.is-done { background: var(--butter-100); }
.trophy { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--butter-300); color: var(--navy-900); }
.trophy svg { fill: var(--butter-500); }
.game-list { display: grid; gap: 10px; }
.game-row, .list-row-card { flex-direction: row; align-items: center; gap: 12px; padding: 14px 16px; }
.game-best { font-weight: 800; font-size: 0.9rem; flex: none; }
.save-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 6px 14px; flex: none;
  border-radius: var(--radius-pill); border: 2px solid var(--line); background: var(--white); color: var(--cobalt-800);
  font-weight: 800; font-size: 0.95rem; cursor: pointer;
}
.save-btn:hover { background: var(--cobalt-100); }
.save-btn.is-on { background: var(--butter-300); border-color: var(--butter-500); color: var(--navy-900); }
.save-btn.is-on svg { fill: currentColor; }

/* ======================================================= permainan */
.game-hud { display: flex; justify-content: space-between; gap: 8px; }
.hud-item { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: var(--radius-pill); background: var(--white); font-weight: 800; box-shadow: var(--shadow-card); }
.hud-item .icon { color: var(--butter-500); }
.hud-item .icon svg { stroke: var(--navy-900); stroke-width: 1.2; }
.hud-item.is-hot { background: var(--butter-300); }
.game-stage { display: grid; gap: 12px; }
.game-card { gap: 16px; }
.game-prompt { font-size: 1.1rem; text-align: center; }
.game-seq { display: block; margin-bottom: 8px; font-size: 1.7rem; font-weight: 900; letter-spacing: 0.01em; }
.game-seq b { color: var(--cobalt-800); }
.game-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.game-opt {
  min-height: 64px; padding: 10px; border-radius: var(--radius-md); border: 2px solid var(--line); background: var(--white);
  font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: transform 120ms; min-width: 0; overflow-wrap: anywhere;
}
.game-opt:active:not(:disabled) { transform: scale(0.96); }
.game-opt:hover:not(:disabled) { border-color: var(--cobalt-500); background: var(--cobalt-100); }
.game-opt.is-correct { border-color: var(--success-600); background: var(--success-100); }
.game-opt.is-wrong { border-color: var(--error-600); background: var(--error-100); }
.susun-slots { min-height: 68px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px; border-radius: var(--radius-md); border: 2px dashed var(--cobalt-300); background: var(--ice-100); }
.susun-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 56px; }
.susun-tile {
  min-width: 56px; height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--cobalt-500);
  background: var(--white); font-size: 1.2rem; font-weight: 900; cursor: pointer;
}
.susun-slots .susun-tile { background: var(--cobalt-100); }
.susun-tile.is-correct { border-color: var(--success-600); background: var(--success-100); }
.susun-tile.is-wrong { border-color: var(--error-600); background: var(--error-100); }

/* ======================================================= bank, kuis, tersimpan, riwayat */
.level-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.level-num { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: 0.95rem; }
.level-1 { background: var(--ice-100); }
.level-2 { background: var(--cobalt-300); }
.level-3 { background: var(--cobalt-500); }
.level-4 { background: var(--navy-900); color: var(--white); }
.module-card.is-locked { opacity: 0.6; }
.module-card.is-locked .level-num { background: var(--line); color: var(--navy-600); }
.kuis { display: grid; gap: 16px; }
.kuis-intro { align-items: center; text-align: center; }
.kuis-intro .setting { width: 100%; text-align: left; }
.kuis-badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--cobalt-100); color: var(--cobalt-800); }
.timer { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-pill); background: var(--white); box-shadow: var(--shadow-card); font-weight: 900; }
.timer-text { min-width: 3.2em; font-variant-numeric: tabular-nums; }
.timer-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--ice-100); overflow: hidden; }
.timer-fill { display: block; height: 100%; width: 100%; background: var(--cobalt-500); transition: width 1s linear; }
.timer.is-low { background: var(--butter-300); }
.timer.is-low .timer-fill { background: var(--error-600); }
.timer.is-done { opacity: 0.6; }
.mini-list { list-style: none; margin: 0; padding: 0; display: grid; }
.mini-list li { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 8px 0; }
.mini-list li + li { border-top: 2px solid var(--ice-100); }
.mt { margin-top: 8px; }
.saved-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.saved-card { gap: 10px; }
.saved-solution { background: var(--butter-300); border-radius: var(--radius-md); padding: 10px 14px; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sum-stat { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--ice-100); }
.sum-stat b { font-size: 1.6rem; font-weight: 900; line-height: 1.1; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "l v" "b b" "n n"; gap: 4px 8px; }
.bar-label { grid-area: l; font-weight: 700; }
.bar-val { grid-area: v; }
.bar-row .bar { grid-area: b; height: 10px; }
.bar-n { grid-area: n; font-size: 0.8rem; }
.bar-fill.is-low { background: var(--butter-500); }
.advice { display: grid; gap: 8px; padding: 12px; border-radius: var(--radius-md); background: var(--cobalt-100); }
.mis-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mis-list li { display: flex; gap: 10px; align-items: flex-start; }
.mis-count { flex: none; min-width: 40px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--error-100); color: var(--error-600); font-weight: 900; text-align: center; }

/* ======================================================= permainan beranimasi */
.game-art { background: var(--ice-100); padding: 4px; }
.game-art svg { width: 100%; height: 100%; }
.game-page { gap: 12px; }
.arena {
  position: relative; height: min(62dvh, 460px); min-height: 360px; border-radius: var(--radius-lg);
  overflow: hidden; box-shadow: var(--shadow-card); touch-action: none; user-select: none; -webkit-user-select: none;
}
.arena.shake { animation: shake 360ms ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.arena-overlay {
  position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
  background: rgba(47, 72, 96, 0.35); backdrop-filter: blur(2px);
}
.overlay-card {
  width: min(100%, 320px); background: var(--white); border-radius: var(--radius-lg); padding: 20px;
  display: grid; gap: 10px; justify-items: center; text-align: center; box-shadow: var(--shadow-fab); animation: page-in 220ms ease-out;
}
.overlay-art { width: 84px; height: 84px; }
.overlay-art svg { width: 100%; height: 100%; }
.overlay-emoji { font-size: 3rem; line-height: 1; }
.overlay-card .finish-actions { width: 100%; }
.seq-bar {
  position: absolute; top: 12px; left: 12px; right: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px;
  justify-content: center; align-items: center; padding: 8px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.92);
}
.seq-chip { min-width: 40px; padding: 4px 8px; border-radius: 10px; background: var(--cobalt-100); font-weight: 900; font-size: 1.05rem; text-align: center; }
.seq-q { background: var(--butter-300); box-shadow: inset 0 0 0 2px var(--butter-500); }
.seq-blank { background: var(--white); box-shadow: inset 0 0 0 2px dashed var(--line); color: var(--navy-600); font-size: 0.85rem; outline: 2px dashed var(--cobalt-300); outline-offset: -2px; }
.seq-hint { font-weight: 800; color: var(--cobalt-800); padding: 0 4px; }
.float-text { position: absolute; z-index: 15; font-weight: 900; font-size: 1.3rem; pointer-events: none; animation: float-up 900ms ease-out forwards; text-shadow: 0 2px 0 var(--white); }
.float-good { color: var(--success-600); }
.float-bad { color: var(--error-600); }
.float-level { color: var(--navy-900); font-size: 1.5rem; background: var(--butter-300); padding: 4px 12px; border-radius: var(--radius-pill); }
@keyframes float-up { from { opacity: 1; transform: translateY(0) scale(0.9); } to { opacity: 0; transform: translateY(-60px) scale(1.15); } }
.fade-out { opacity: 0; transition: opacity 250ms; }

/* ---- Lompat Katak */
.arena-katak { background: var(--game-water); }
.pond { position: absolute; inset: 0; background: linear-gradient(180deg, var(--cobalt-100) 0%, var(--game-water) 35%, var(--cobalt-500) 100%); }
.ripple { position: absolute; width: 90px; height: 24px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.55); animation: ripple 3.2s ease-out infinite; }
.r1 { left: 8%; top: 62%; } .r2 { left: 62%; top: 70%; animation-delay: 1.1s; } .r3 { left: 34%; top: 52%; animation-delay: 2.2s; }
@keyframes ripple { from { transform: scale(0.4); opacity: 0.9; } to { transform: scale(1.6); opacity: 0; } }
.pad {
  position: absolute; z-index: 3; width: 88px; height: 56px; margin: -28px 0 0 -44px; border: 0; padding: 0;
  border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; background: radial-gradient(circle at 40% 35%, var(--game-pad), var(--game-pad-dark));
  box-shadow: 0 6px 0 rgba(47, 72, 96, 0.18); display: grid; place-items: center;
}
.pad span { font-weight: 900; font-size: 1.3rem; color: var(--navy-900); background: rgba(255, 255, 255, 0.85); border-radius: 10px; padding: 0 8px; }
.pad-opt { cursor: pointer; animation: bob 2.4s ease-in-out infinite; }
.pad-0 { left: 20%; top: 46%; } .pad-1 { left: 50%; top: 34%; animation-delay: 0.4s; } .pad-2 { left: 80%; top: 46%; animation-delay: 0.8s; }
.pad-home { left: 50%; top: 82%; }
.pad-opt:hover:not(:disabled) { filter: brightness(1.08); }
.pad-opt:disabled { cursor: default; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
.pop-in { animation: pad-in 380ms ease-out, bob 2.4s ease-in-out 380ms infinite; }
@keyframes pad-in { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pad-good { animation: none; box-shadow: 0 0 0 5px var(--butter-500), 0 6px 0 rgba(47, 72, 96, 0.18); }
.pad-sink { animation: sink 700ms ease-in forwards; }
@keyframes sink { to { transform: scale(0.3) translateY(30px); opacity: 0; } }
.frog { position: absolute; z-index: 6; left: 50%; top: 82%; width: 60px; height: 60px; margin: -80px 0 0 -30px; pointer-events: none; }
.frog svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 2px rgba(47, 72, 96, 0.25)); }
.frog.jump { animation: frog-jump 480ms cubic-bezier(.3, .7, .4, 1) forwards; }
@keyframes frog-jump {
  0% { transform: translate(0, 0) scale(1, 0.85); }
  45% { transform: translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5 - 70px)) scale(0.95, 1.1); }
  100% { transform: translate(var(--dx), var(--dy)) scale(1); }
}

.arena-tangkap, .arena-balon { background: var(--game-sky); }
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--ice-100), var(--white) 70%, var(--butter-100)); }
.cloud { position: absolute; width: 110px; height: 34px; border-radius: 40px; background: var(--white); box-shadow: 30px -14px 0 4px var(--white); opacity: 0.9; animation: drift 18s linear infinite; }
.c1 { top: 26%; left: -120px; } .c2 { top: 55%; left: -120px; animation-delay: 9s; animation-duration: 24s; }
@keyframes drift { to { transform: translateX(640px); } }
.drop {
  position: absolute; left: 0; top: 0; z-index: 4; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; color: var(--navy-900);
  box-shadow: 0 4px 0 rgba(47, 72, 96, 0.2); will-change: transform;
}
.drop-0 { background: var(--butter-500); } .drop-1 { background: var(--cobalt-300); } .drop-2 { background: var(--white); box-shadow: inset 0 0 0 3px var(--cobalt-500), 0 4px 0 rgba(47, 72, 96, 0.2); }

.drop.caught-bad { background: var(--error-100); color: var(--error-600); transition: opacity 300ms; opacity: 0; }
.basket { position: absolute; left: 0; bottom: 18px; z-index: 5; width: 90px; height: 44px; will-change: transform; }

.basket.bounce svg { animation: bounce 300ms ease; }

}
.ctrl-btn:active { background: var(--cobalt-100); transform: scale(0.97); }
.balloon {
  position: absolute; left: 0; top: 0; z-index: 4; width: 64px; height: 92px; border: 0; padding: 0; background: none;
  cursor: pointer; will-change: transform;
}
.balloon::before {
  content: ''; position: absolute; left: 0; top: 0; width: 64px; height: 76px; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
  background: var(--bal, var(--cobalt-500)); box-shadow: inset -8px -10px 0 rgba(47, 72, 96, 0.12);
}
.balloon::after { content: ''; position: absolute; left: 31px; top: 76px; width: 1.5px; height: 18px; background: var(--navy-600); }

.balloon.wiggle { animation: wiggle 400ms ease; }
@keyframes wiggle { 25% { rotate: -12deg; } 75% { rotate: 12deg; } }
.burst {

ai a adalah …","options":["3","6","9"],"answer":1,"explanation":"a adalah suku pertama, yaitu 6."}]}]},"modules/m4.json":{"id":"m4","title":"Memakai Rumus","goal":"Menentukan a, b, n lalu menghitung Uₙ","steps":[{"kind":"hook","title":"Angka mana yang dimasukkan?","text":"Untuk mencari U<sub>10<\/sub> dari 5, 8, 11, 14, angka apa saja yang dimasukkan ke rumus?","reveal":"Tiga angka: <b>a = 5<\/b>, <b>b = 3<\/b>, dan <b>n = 10<\/b>. Bukan hanya 5!"},{"kind":"concept","title":"Tiga langkah","text":"<ol class=\"steps\"><li>Temukan <span class=\"chip chip-a\">a<\/span>, <span class=\"chip chip-b\">b<\/span>, <span class=\"chip chip-n\">n<\/span>.<\/li><li>Masukkan ke rumus.<\/li><li>Hitung: kurung dulu, lalu kali, lalu tambah.<\/li><\/ol>"},{"kind":"concept","title":"Hati-hati dengan n","text":"<span class=\"chip chip-n\">n<\/span> adalah <b>nomor suku<\/b> yang ditanya, bukan nilai sukunya. Untuk U<sub>10<\/sub>, nilai n = 10.","visual":"terms:5,8,11,14"},{"kind":"example","title":"Contoh 1","problem":"Barisan <b>5, 8, 11, 14, …<\/b> Tentukan U<sub>10<\/sub>.","steps":["a = 5, b = 3, n = 10","U<sub>10<\/sub> = 5 + (10 − 1) × 3","= 5 + 9 × 3 = 5 + 27","= <b>32<\/b>"]},{"kind":"example","title":"Contoh 2","problem":"Barisan <b>2, 9, 16, 23, …<\/b> Tentukan U<sub>20<\/sub>.","steps":["a = 2, b = 7, n = 20","U<sub>20<\/sub> = 2 + (20 − 1) × 7","= 2 + 19 × 7 = 2 + 133","= <b>135<\/b>"]},{"kind":"example","title":"Contoh 3","problem":"Barisan <b>50, 46, 42, …<\/b> Tentukan U<sub>12<\/sub>.","steps":["a = 50, b = −4, n = 12","U<sub>12<\/sub> = 50 + (12 − 1) × (−4)","= 50 + 11 × (−4) = 50 − 44","= <b>6<\/b>"]},{"kind":"faded","title":"Coba lengkapi","problem":"Barisan <b>4, 10, 16, …<\/b> Tentukan U<sub>8<\/sub>.","steps":["a = 4, b = 6, n = 8","U<sub>8<\/sub> = 4 + (8 − 1) × 6 = 4 + [[42]]","U<sub>8<\/sub> = [[46]]"]},{"kind":"faded","title":"Lengkapi lebih banyak","problem":"Barisan <b>30, 27, 24, …<\/b> Tentukan U<sub>9<\/sub>.","steps":["a = [[30]], b = [[-3]], n = [[9]]","U<sub>9<\/sub> = [[6]]"]},{"kind":"practice","title":"Latihan","templates":["T-identify","T-un"],"count":6},{"kind":"explain","title":"Temukan kesalahannya","question":"Seorang siswa menulis: U<sub>10<\/sub> dari 5, 8, 11, … = 5 + 10 × 3 = 35. Apa kesalahannya?","options":[{"text":"Seharusnya dikali (10 − 1), bukan 10.","correct":true,"why":"Tepat! Hasil yang benar 5 + 9 × 3 = 32."},{"text":"Seharusnya a = 3.","correct":false,"why":"a adalah suku pertama, yaitu 5. Yang 3 adalah b."},{"text":"Tidak ada yang salah.","correct":false,"why":"Coba cek: suku ke-10 dari 5, 8, 11, … adalah 32, bukan 35."}]},{"kind":"quiz","title":"Kuis Modul 4","items":[{"type":"numeric","prompt":"Barisan 6, 11, 16, … Nilai b = …","answer":5,"explanation":"11 − 6 = 5."},{"type":"numeric","prompt":"Barisan 6, 11, 16, … Nilai U<sub>15<\/sub> = …","answer":76,"explanation":"6 + 14 × 5 = 6 + 70 = 76."},{"type":"numeric","prompt":"Barisan 40, 37, 34, … Nilai U<sub>10<\/sub> = …","answer":13,"explanation":"40 + 9 × (−3) = 40 − 27 = 13."},{"type":"numeric","prompt":"Untuk mencari U<sub>25<\/sub> dari 1, 4, 7, …, nilai n = …","answer":25,"explanation":"n adalah nomor suku yang dicari, yaitu 25."},{"type":"mcq","prompt":"Langkah yang benar untuk U<sub>8<\/sub> dari 2, 6, 10, … adalah …","options":["2 + 8 × 4","2 + 7 × 4","(2 + 7) × 4"],"answer":1,"explanation":"U<sub>8<\/sub> = a + (8 − 1)b = 2 + 7 × 4 = 30."}]}]},"modules/m5.json":{"id":"m5","title":"Mencari yang Belum Diketahui","goal":"Mencari n, a, atau b jika unsur lain diketahui","steps":[{"kind":"hook","title":"Dibalik","text":"Kalau U<sub>n<\/sub> sudah diketahui, bisakah kita mencari n, a, atau b?","reveal":"Bisa! Rumusnya sama. Kita hanya membaliknya."},{"kind":"concept","title":"Mencari n","text":"Masukkan semua yang diketahui ke U<sub>n<\/sub> = a + (n − 1)b. Lalu selesaikan seperti persamaan: kurangi a, bagi dengan b, lalu tambah 1."},{"kind":"example","title":"Contoh 1: mencari n","problem":"Barisan <b>7, 11, 15, …, 87<\/b>. Bilangan 87 suku ke berapa?","steps":["87 = 7 + (n − 1) × 4","80 = (n − 1) × 4","n − 1 = 80 ÷ 4 = 20","n = <b>21<\/b>"]},{"kind":"example","title":"Contoh 2: mencari b","problem":"Diketahui <b>a = 4<\/b> dan <b>U<sub>6<\/sub> = 29<\/b>. Tentukan b.","steps":["29 = 4 + (6 − 1)b","29 = 4 + 5b","25 = 5b","b = <b>5<\/b>"]},{"kind":"concept","title":"Dua suku diketahui","text":"Jika dua suku diketahui, hitung lompatan di antaranya. Dari U<sub>3<\/sub> ke U<sub>7<\/sub> ada 7 − 3 = <b>4 lompatan<\/b>.","visual":"jumps:3,4,7"},{"kind":"example","title":"Contoh 3: mencari a dan b","problem":"Diketahui <b>U<sub>3<\/sub> = 11<\/b> dan <b>U<sub>7<\/sub> = 27<\/b>. Tentukan a dan b.","steps":["Dari U<sub>3<\/sub> ke U<sub>7<\/sub> ada 4 lompatan.","4b = 27 − 11 = 16, jadi <b>b = 4<\/b>","U<sub>3<\/sub> = a + 2b → 11 = a + 8","<b>a = 3<\/b>"]},{"kind":"faded","title":"Coba lengkapi","problem":"Barisan <b>3, 8, 13, …, 58<\/b>. Bilangan 58 suku ke berapa?","steps":["58 = 3 + (n − 1) × 5","55 = (n − 1) × 5","n − 1 = [[11]]","n = [[12]]"]},{"kind":"practice","title":"Latihan","templates":["T-find-n","T-find-b","T-two-terms"],"count":5},{"kind":"quiz","title":"Kuis Modul 5","items":[{"type":"numeric","prompt":"Barisan 2, 5, 8, …, 50. Bilangan 50 suku ke-…","answer":17,"explanation":"50 = 2 + (n − 1) × 3 → n − 1 = 16 → n = 17."},{"type":"numeric","prompt":"Diketahui a = 10 dan U<sub>5<\/sub> = 30. Nilai b = …","answer":5,"explanation":"30 = 10 + 4b → 4b = 20 → b = 5."},{"type":"numeric","prompt":"Diketahui U<sub>2<\/sub> = 7 dan U<sub>6<\/sub> = 19. Nilai b = …","answer":3,"explanation":"Ada 4 lompatan: 4b = 19 − 7 = 12 → b = 3."},{"type":"numeric","prompt":"Diketahui U<sub>2<\/sub> = 7 dan U<sub>6<\/sub> = 19. Nilai a = …","answer":4,"explanation":"U<sub>2<\/sub> = a + b → 7 = a + 3 → a = 4."},{"type":"mcq","prompt":"Dari (n − 1) × 3 = 27, nilai n adalah …","options":["9","10","27"],"answer":1,"explanation":"n − 1 = 9, jadi n = 10."}]}]},"modules/m6.json":{"id":"m6","title":"Soal Cerita dan Li window.__METIKA_MODULES__ = [["js/store.js","// Penyimpanan lokal. Semua akses dibungkus try/catch: app tetap jalan\n// walau localStorage diblokir (mode privat), hanya progres tidak tersimpan.\n\nconst PREFIX = 'lb1:';\nconst memory = new Map();\n\nfunction clone(v) {\n  return v === undefined ? v : JSON.parse(JSON.stringify(v));\n}\n\nexport function get(key, fallback) {\n  try {\n    const raw = localStorage.getItem(PREFIX + key);\n    if (raw != null) return JSON.parse(raw);\n  } catch { /* storage tidak tersedia */ }\n  return memory.has(key) ? clone(memory.get(key)) : clone(fallback);\n}\n\nexport function set(key, value) {\n  if (value === undefined) {\n    memory.delete(key);\n    try { localStorage.removeItem(PREFIX + key); } catch { /* abaikan */ }\n    return;\n  }\n  memory.set(key, clone(value));\n  try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch { /* abaikan */ }\n}\n\nexport function update(key, fallback, fn) {\n  const next = fn(get(key, fallback));\n  set(key, next);\n  return next;\n}\n\nexport function clearAll() {\n  memory.clear();\n  try {\n    Object.keys(localStorage).filter((k) => k.startsWith(PREFIX)).forEach((k) => localStorage.removeItem(k));\n  } catch { /* abaikan */ }\n}\n\n// ------------------------------------------------------------ domain\n\nexport const getProfile = () => get('profile', null);\nexport const setProfile = (p) => set('profile', p);\n\nexport const getSettings = () => get('settings', { fontScale: 'normal', sound: false });\nexport const setSettings = (s) => set('settings', s);\n\nexport function getModuleProgress(mid) {\n  return get('progress', {})[mid] || { step: 0, maxStep: 0, done: false, stars: 0, quizScore: null, practice: null };\n}\n\nexport function saveModuleProgress(mid, patch) {\n  return update('progress', {}, (all) => {\n    const cur = all[mid] || { step: 0, maxStep: 0, done: false, stars: 0, quizScore: null, practice: null };\n    all[mid] = { ...cur, ...patch, lastOpened: new Date().toISOString() };\n    return all;\n  })[mid];\n}\n\nexport const allProgress = () => get('progress', {});\n\nexport function getStats() {\n  return get('stats', { correct: 0, answered: 0, hints: 0 });\n}\n\nexport function bumpStats(patch) {\n  return update('stats', { correct: 0, answered: 0, hints: 0 }, (s) => {\n    for (const [k, v] of Object.entries(patch)) s[k] = (s[k] || 0) + v;\n    return s;\n  });\n}\n\n// Kumpulan soal: confused (salah karena miskonsepsi), hard (salah 2x / semua petunjuk),\n// flagged (soal tersimpan lewat bookmark). \"mistakes\" = gabungan confused + hard.\nexport const FOLDERS = {\n  confused: { title: 'Soal yang salah' },\n  hard: { title: 'Soal yang salah' },\n  mistakes: { title: 'Perbaiki soal yang salah' },\n  flagged: { title: 'Soal tersimpan' },\n};\n\n// ------------------------------------------------------------ riwayat belajar (lokal)\nconst HISTORY_MAX = 600;\n\n/** Catat hasil satu soal: { source, tid, topic, firstTry, solved, attempts, hintLevel, misconception } */\nexport function pushHistory(entry) {\n  update('history', [], (h) => {\n    h.push({ ...entry, ts: new Date().toISOString() });\n    return h.length > HISTORY_MAX ? h.slice(-HISTORY_MAX) : h;\n  });\n}\nexport const getHistory = () => get('history', []);\n\n/** Catat hasil kuis: { kind: 'timed'|'module'|'challenge'|'bank', id, score, total, seconds } */\nexport function pushQuizHistory(entry) {\n  update('quizHistory', [], (h) => {\n    h.push({ ...entry, ts: new Date().toISOString() });\n    return h.slice(-100);\n  });\n}\nexport const getQuizHistory = () => get('quizHistory', []);\n\nexport const getBank = () => get('bank', {});\nexport function saveBankResult(level, score, total) {\n  return update('bank', {}, (b) => {\n    const cur = b[level] || { best: 0, total, plays: 0 };\n    b[level] = { best: Math.max(cur.best, score), total, plays: cur.plays + 1, last: score };\n    return b;\n  });\n}\n\nexport function getReview() {\n  return get('review', { confused: {}, hard: {}, flagged: {} });\n}\n\nexport function addReview(folder, key, item) {\n  update('review', { confused: {}, hard: {}, flagged: {} }, (r) => {\n    r[folder] = r[folder] || {};\n    r[folder][key] = { ...item, addedAt: new Date().toISOString() };\n    return r;\n  });\n}\n\nexport function removeReview(folder, key) {\n  update('review', { confused: {}, hard: {}, flagged: {} }, (r) => {\n    if (r[folder]) delete r[folder][key];\n    return r;\n  });\n}\n\nexport function isFlagged(key) {\n  return Boolean(getReview().flagged[key]);\n}\n"],["js/router.js","// Hash router sederhana: #/m/m3 → { view: lesson, params: { id: 'm3' } }\n\nconst routes = [];\n\nexport function route(pattern, loader, { focus = false, tab = null, guest = false } = {}) {\n  const keys = [];\n  const re = new RegExp(`^${pattern.replace(/:(\\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; })}$`);\n  routes.push({ re, keys, loader, focus, tab, guest });\n}\n\nexport function match(path) {\n  for (const r of routes) {\n    const m = path.match(r.re);\n    if (m) return { ...r, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) };\n  }\n  return null;\n}\n\nexport function currentPath() {\n  return (location.hash.replace(/^#/, '') || '/').replace(/\\/+$/, '') || '/';\n}\n\nexport function go(path) {\n  if (currentPath() === path) window.dispatchEvent(new HashChangeEvent('hashchange'));\n  else location.hash = path;\n}\n"],["js/content.js","// Memuat konten JSON dari folder content/. Service worker menyimpannya\n// untuk dipakai offline.\n\nconst cache = new Map();\n\nasync function fetchJson(path) {\n  if (!cache.has(path)) {\n    // content/ (server FastAPI) atau ../content/ (frontend dibuka lewat Live Server dari folder proyek)\n    const p = fetch(`content/${path}`)\n      .then((res) => (res.ok ? res : fetch(`../content/${path}`)))\n      .then((res) => {\n        if (!res.ok) throw new Error(`Gagal memuat ${path} (${res.status})`);\n        return res.json();\n      });\n    cache.set(path, p);\n    p.catch(() => cache.delete(path));\n  }\n  return cache.get(path);\n}\n\nexport const manifest = () => fetchJson('manifest.json');\n\nexport async function moduleMeta(id) {\n  const m = await manifest();\n  return m.modules.find((x) => x.id === id) || null;\n}\n\nexport async function loadModule(id) {\n  const meta = await moduleMeta(id);\n  if (!meta) throw new Error(`Modul ${id} tidak ditemukan`);\n  return fetchJson(meta.file);\n}\n\nexport async function templates() { return fetchJson((await manifest()).templates); }\nexport async function misconceptions() { return fetchJson((await manifest()).misconceptions); }\nexport async function challenge() { return fetchJson((await manifest()).challenge); }\nexport async function tests() { return fetchJson((await manifest()).tests); }\nexport async function surveys() { return fetchJson((await manifest()).surveys); }\n\n/** Muat semua file agar tersimpan di cache service worker (siap offline). */\nexport async function preloadAll() {\n  const m = await manifest();\n  await Promise.allSettled([\n    ...m.modules.map((x) => fetchJson(x.file)),\n    templates(), misconceptions(), challenge(), tests(), surveys(),\n  ]);\n}\n"],["js/engine/expr.js","// Parser ekspresi aman (tanpa eval). Pasangan dari backend/app/services/solver.py.\n// Mendukung: angka, variabel, + - * / %, minus unary, kurung, abs(), floor(),\n// dan satu perbandingan (< <= > >= == !=).\n\nconst FUNCS = { abs: Math.abs, floor: Math.floor };\nconst cache = new Map();\n\nfunction tokenize(src) {\n  const s = src.replace(/−/g, '-');\n  const tokens = [];\n  let i = 0;\n  while (i < s.length) {\n    const c = s[i];\n    if (c === ' ' || c === '\\t') { i++; continue; }\n    if (/[0-9.]/.test(c)) {\n      let j = i;\n      while (j < s.length && /[0-9.]/.test(s[j])) j++;\n      tokens.push({ t: 'num', v: Number(s.slice(i, j)) });\n      i = j; continue;\n    }\n    if (/[A-Za-z_]/.test(c)) {\n      let j = i;\n      while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;\n      tokens.push({ t: 'id', v: s.slice(i, j) });\n      i = j; continue;\n    }\n    const two = s.slice(i, i + 2);\n    if (['<=', '>=', '==', '!='].includes(two)) { tokens.push({ t: 'op', v: two }); i += 2; continue; }\n    if ('+-*/%()<>'.includes(c)) { tokens.push({ t: 'op', v: c }); i++; continue; }\n    throw new Error(`Karakter tidak dikenal \"${c}\" di \"${src}\"`);\n  }\n  return tokens;\n}\n\nfunction parse(src) {\n  const tk = tokenize(src);\n  let p = 0;\n  const peek = () => tk[p];\n  const take = (v) => {\n    const t = tk[p];\n    if (!t || (v && t.v !== v)) throw new Error(`Sintaks salah di \"${src}\"`);\n    p++; return t;\n  };\n\n  function primary() {\n    const t = peek();\n    if (!t) throw new Error(`Ekspresi terpotong: \"${src}\"`);\n    if (t.t === 'num') { p++; return () => t.v; }\n    if (t.t === 'id') {\n      p++;\n      if (peek() && peek().v === '(') {\n        const fn = FUNCS[t.v];\n        if (!fn) throw new Error(`Fungsi tidak diizinkan: ${t.v}`);\n        take('('); const arg = comparison(); take(')');\n        return (env) => fn(arg(env));\n      }\n      const name = t.v;\n      return (env) => {\n        if (!(name in env)) throw new Error(`Variabel tidak dikenal \"${name}\" di \"${src}\"`);\n        return env[name];\n      };\n    }\n    if (t.v === '(') { take('('); const e = comparison(); take(')'); return e; }\n    throw new Error(`Sintaks salah di \"${src}\"`);\n  }\n  function unary() {\n    const t = peek();\n    if (t && t.t === 'op' && (t.v === '-' || t.v === '+')) {\n      p++; const u = unary();\n      return t.v === '-' ? (env) => -u(env) : u;\n    }\n    return primary();\n  }\n  function term() {\n    let left = unary();\n    while (peek() && ['*', '/', '%'].includes(peek().v)) {\n      const op = take().v; const l = left; const r = unary();\n      left = op === '*' ? (e) => l(e) * r(e)\n        : (e) => {\n          const d = r(e);\n          if (d === 0) throw new Error(`Pembagian dengan nol di \"${src}\"`);\n          return op === '/' ? l(e) / d : l(e) % d;\n        };\n    }\n    return left;\n  }\n  function additive() {\n    let left = term();\n    while (peek() && (peek().v === '+' || peek().v === '-')) {\n      const op = take().v; const l = left; const r = term();\n      left = op === '+' ? (e) => l(e) + r(e) : (e) => l(e) - r(e);\n    }\n    return left;\n  }\n  function comparison() {\n    const left = additive();\n    const t = peek();\n    if (t && t.t === 'op' && ['<', '<=', '>', '>=', '==', '!='].includes(t.v)) {\n      p++; const right = additive();\n      const ops = {\n        '<': (a, b) => a < b, '<=': (a, b) => a <= b, '>': (a, b) => a > b,\n        '>=': (a, b) => a >= b, '==': (a, b) => a === b, '!=': (a, b) => a !== b,\n      };\n      const f = ops[t.v];\n      return (e) => f(left(e), right(e));\n    }\n    return left;\n  }\n\n  const fn = comparison();\n  if (p !== tk.length) throw new Error(`Sisa token tidak terbaca di \"${src}\"`);\n  return fn;\n}\n\nexport function compile(src) {\n  let fn = cache.get(src);\n  if (!fn) { fn = parse(src); cache.set(src, fn); }\n  return fn;\n}\n\nexport function evaluate(src, env) {\n  return compile(String(src))(env);\n}\n\n/** Bulatkan galat floating point (sama dengan solver.clean). */\nexport function clean(v) {\n  if (typeof v === 'boolean') return v;\n  const r = Math.round(v * 1e9) / 1e9;\n  return Object.is(r, -0) ? 0 : r;\n}\n"],["js/engine/anon.js","// ID anonim dari kode kelas + nomor absen. Tidak menyimpan nama.\n// Memakai hash cyrb53 (non-kriptografis) agar hasilnya sama di semua browser,\n// termasuk halaman http di jaringan lokal (crypto.subtle hanya ada di HTTPS).\n\n// Salt sengaja tetap dari nama lama agar ID anonim siswa tidak berubah.\nconst SALT = 'langkahbeda-2026';\n\nexport function cyrb53(str, seed = 0) {\n  let h1 = 0xdeadbeef ^ seed;\n  let h2 = 0x41c6ce57 ^ seed;\n  for (let i = 0; i < str.length; i++) {\n    const ch = str.charCodeAt(i);\n    h1 = Math.imul(h1 ^ ch, 2654435761);\n    h2 = Math.imul(h2 ^ ch, 1597334677);\n  }\n  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);\n  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);\n  return 4294967296 * (2097151 & h2) + (h1 >>> 0);\n}\n\nexport function normalizeClassCode(code) {\n  return String(code || '').trim().toUpperCase().replace(/\\s+/g, '').slice(0, 32);\n}\n\n/** 16 karakter heksadesimal, cocok dengan pola ANON_RE di backend. */\nexport function anonId(classCode, studentNo) {\n  const key = `${normalizeClassCode(classCode)}#${String(studentNo).trim()}#${SALT}`;\n  const p1 = cyrb53(key, 1).toString(16).padStart(14, '0');\n  const p2 = cyrb53(key, 2).toString(16).padStart(14, '0');\n  return (p1 + p2).slice(0, 16);\n}\n\nexport function guestId() {\n  return anonId(`TAMU-${Date.now()}-${Math.random()}`, 0);\n}\n"],["js/api.js","// Antrean data penelitian (offline-first). Event disimpan di \"outbox\" lalu\n// dikirim ke server saat online. Jika server tidak ada, app tetap berjalan.\nimport * as store from './store.js';\n\nexport const APP_VERSION = '1.1.0';\nconst OUTBOX_MAX = 3000;\nconst BATCH = 200;\nlet serverOk = null; // null = belum dicek\nlet syncing = false;\n\nfunction uuid() {\n  if (globalThis.crypto?.randomUUID) return crypto.randomUUID();\n  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;\n}\n\nfunction enqueue(kind, body) {\n  store.update('outbox', [], (box) => {\n    box.push({ kind, body });\n    return box.length > OUTBOX_MAX ? box.slice(-OUTBOX_MAX) : box;\n  });\n}\n\nexport function logEvent(type, { module_id = null, item_id = null, payload = {} } = {}) {\n  const profile = store.getProfile();\n  if (!profile) return;\n  enqueue('event', {\n    client_id: uuid(),\n    anon_id: profile.anonId,\n    type,\n    module_id,\n    item_id: item_id ? String(item_id).slice(0, 64) : null,\n    payload,\n    client_ts: new Date().toISOString(),\n  });\n}\n\nexport function queueSurvey(kind, module_id, answers) {\n  const profile = store.getProfile();\n  if (!profile) return;\n  enqueue('survey', {\n    client_id: uuid(), anon_id: profile.anonId, kind, module_id, answers, client_ts: new Date().toISOString(),\n  });\n}\n\nexport function queueParticipant(profile) {\n  enqueue('participant', { anon_id: profile.anonId, class_code: profile.classCode, app_version: APP_VERSION });\n}\n\nexport const outboxSize = () => store.get('outbox', []).length;\nexport const serverStatus = () => serverOk;\n\nasync function post(path, body) {\n  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });\n  if (!res.ok) {\n    const err = new Error(`HTTP ${res.status}`);\n    err.status = res.status;\n    throw err;\n  }\n  return res.json();\n}\n\nasync function checkServer() {\n  try {\n    const res = await fetch('api/health', { cache: 'no-store' });\n    serverOk = res.ok && (res.headers.get('content-type') || '').includes('json');\n  } catch {\n    serverOk = false;\n  }\n  return serverOk;\n}\n\n/** Kirim isi outbox. Aman dipanggil berkali-kali. */\nexport async function sync() {\n  if (syncing || !navigator.onLine) return;\n  syncing = true;\n  try {\n    if (!serverOk && !(await checkServer())) return;\n    let box = store.get('outbox', []);\n    while (box.length) {\n      const head = box[0];\n      let taken;\n      if (head.kind === 'event') {\n        taken = [];\n        while (taken.length < BATCH && box[taken.length]?.kind === 'event') taken.push(box[taken.length]);\n        await post('api/events', { events: taken.map((x) => x.body) });\n      } else {\n        taken = [head];\n        await post(head.kind === 'survey' ? 'api/surveys' : 'api/participants', head.body);\n      }\n      box = store.update('outbox', [], (cur) => cur.slice(taken.length));\n    }\n  } catch (err) {\n    // 422 = dat : 'welcome-actions' }, next, skip));\n  show(0);\n}\n"],["js/components/story.js","// Ruang Kerja Soal Cerita 5 langkah (FR-10, literasi matematika):\n// Diketahui → Ditanya → Ubah ke barisan → Hitung → Periksa & tafsirkan.\nimport { h, html, button, numberInput, choiceList, markChoice, feedback, sound, contextBadge } from '../ui.js';\nimport { renderVisual } from './viz.js';\nimport { checkField } from '../engine/checker.js';\nimport { fmt, fmtMoney } from '../engine/format.js';\nimport { clean } from '../engine/expr.js';\nimport { logEvent } from '../api.js';\nimport * as store from '../store.js';\nimport * as content from '../content.js';\n\nconst STEPS = [\n  { key: 'known', title: 'Diketahui', ask: 'Apa yang diketahui dari cerita?' },\n  { key: 'asked', title: 'Ditanya', ask: 'Apa yang ditanyakan?' },\n  { key: 'model', title: 'Ubah ke barisan', ask: 'Tentukan angka-angkanya.' },\n  { key: 'compute', title: 'Hitung', ask: 'Masukkan ke rumus, lalu hitung.' },\n  { key: 'interpret', title: 'Periksa & tafsirkan', ask: 'Apa arti jawabanmu?' },\n];\n\nlet uid = 0;\n\nexport async function storyWorkspace(container, step, { moduleId, onComplete }) {\n  const misc = await content.misconceptions();\n  const m = step.model;\n  const target = step.target;\n  const answer = target === 'un' ? clean(m.a + (m.n - 1) * m.b) : clean((m.un - m.a) / m.b + 1);\n  const env = target === 'un' ? { a: m.a, b: m.b, n: m.n } : { a: m.a, b: m.b, un: m.un, n: answer };\n  const show = (v) => (step.money ? fmtMoney(v) : fmt(v));\n  const unit = step.money ? '' : ` ${step.unit}`;\n  let current = 0;\n  const startedAt = performance.now();\n\n  const storyCard = h('details', { class: 'card story-card', open: true },\n    h('summary', {}, contextBadge(`Pojok Literasi · ${step.context}`), h('span', { class: 'story-title' }, step.title)),\n    html('div', 'story-text', step.text),\n    renderVisual(step.visual));\n  const list = h('ol', { class: 'stepper' });\n  const items = STEPS.map((s, i) => {\n    const body = h('div', { class: 'stepper-body' });\n    const li = h('li', { class: 'stepper-item' },\n      h('div', { class: 'stepper-head' }, h('span', { class: 'stepper-num' }, String(i + 1)), h('span', { class: 'stepper-title' }, s.title), h('span', { class: 'stepper-done' })),\n      body);\n    list.append(li);\n    return { li, body };\n  });\n  container.replaceChildren(storyCard, list);\n\n  function setState() {\n    items.forEach(({ li }, i) => {\n      li.classList.toggle('is-done', i < current);\n      li.classList.toggle('is-current', i === current);\n    });\n  }\n\n  function advance(summary) {\n    items[current].body.replaceChildren(html('p', 'stepper-summary', summary));\n    logEvent('story_step', { module_id: moduleId, item_id: step.id, payload: { step: STEPS[current].key } });\n    current++;\n    setState();\n    if (current < STEPS.length) renderStep(current);\n    items[Math.min(current, STEPS.length - 1)].li.scrollIntoView({ behavior: 'smooth', block: 'center' });\n  }\n\n  // Langkah pilihan ganda (Diketahui, Ditanya, Tafsir, Nalar).\n  function choiceStep(body, choice, question, onRight) {\n    const fb = h('div', { class: 'q-feedback' });\n    let wrongs = 0;\n    const { list: cl, buttons } = choiceList(choice.options, {\n      onPick: (idx) => {\n        if (idx === choice.answer) {\n          sound('correct');\n          markChoice(buttons, idx, 'correct');\n          buttons.forEach((b) => { b.disabled = true; });\n          fb.replaceChildren(choice.explanation ? feedback('correct', 'Tepat!', choice.explanation) : '');\n          setTimeout(() => onRight(choice.options[idx]), choice.explanation ? 0 : 450);\n        } else {\n          sound('wrong');\n          wrongs++;\n          markChoice(buttons, idx, 'wrong');\n          fb.replaceChildren(feedback('hint', 'Coba lagi', choice.hint || (wrongs > 1 && choice.explanation) || 'Baca lagi ceritanya pelan-pelan.'));\n        }\n      },\n    });\n    body.replaceChildren(html('p', 'stepper-ask', question), cl, fb);\n  }\n\n  function renderStep(i) {\n    const s = STEPS[i];\n    const body = items[i].body;\n    if (s.key === 'known' || s.key === 'asked') {\n      choiceStep(body, step[s.key], s.ask, (text) => advance(text));\n      return;\n    }\n    if (s.key === 'model') {\n      const fields = target === 'un'\n        ? [{ key: 'a', label: 'a = suku pertama', chip: 'a', answer: m.a, misconceptions: [] },\n          { key: 'b', label: 'b = beda', chip: 'b', answer: m.b, misconceptions: [] },\n          { key: 'n', label: 'n = suku yang dicari', chip: 'n', answer: m.n, misconceptions: [] }]\n        : [{ key: 'a', label: 'a = suku pertama', chip: 'a', answer: m.a, misconceptions: [] },\n          { key: 'b', label: 'b = beda', chip: 'b', answer: m.b, misconceptions: [] },\n          { key: 'un', label: 'U<sub>n<\/sub> = nilai yang dicapai', chip: null, answer: m.un, misconceptions: [] }];\n      numericStep(body, s.ask, fields, {\n        hint: m.b < 0 ? 'Nilainya berkurang, jadi b negatif. Pakai tombol ±.' : 'a = angka awal, b = tambahannya.',\n        onRight: () => {\n          const seq = [0, 1, 2].map((k) => show(m.a + k * m.b)).join(', ');\n          const parts = target === 'un' ? `a = ${fmt(m.a)}, b = ${fmt(m.b)}, n = ${m.n}` : `a = ${fmt(m.a)}, b = ${fmt(m.b)}, U<sub>n<\/sub> = ${fmt(m.un)}`;\n          advance(`${parts}<br>Barisannya: ${seq}, …`);\n        },\n      });\n      return;\n    }\n    if (s.key === 'compute') {\n      const formula = target === 'un'\n        ? `U<sub>${m.n}<\/sub> = ${fmt(m.a)} + (${m.n} − 1) × ${fmt(m.b, { paren: true })}`\n        : `${fmt(m.un)} = ${fmt(m.a)} + (n − 1) × ${fmt(m.b, { paren: true })}`;\n      const field = {\n        key: target, label: target === 'un' ? `U<sub>${m.n}<\/sub> =` : 'n =', answer,\n        misconceptions: target === 'un' ? ['M1', 'M2', 'M3', 'M4', 'M6', 'M7', 'M8'] : ['M9', 'M8'],\n      };\n      const hints = target === 'un'\n        ? [`Kurung dulu: ${m.n} − 1
